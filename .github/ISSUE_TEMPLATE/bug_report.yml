name: Bug report
description: Something produces a wrong or unexpected result
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: >
        The smallest script that shows the problem, ideally self-contained
        (synthetic input rather than an attached data file).
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `python -c 'import catagg; print(catagg.__version__)'`"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
    validations:
      required: true
