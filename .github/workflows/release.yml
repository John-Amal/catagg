name: Release

# Publishes to PyPI using Trusted Publishing (OIDC). No API token is stored
# anywhere in this repository.
#
# Two ways in:
#   * workflow_dispatch -- manual run, used for the initial name claim and for
#     any .devN pre-release.
#   * release: published -- the normal path. Tag vX.Y.Z, publish the GitHub
#     Release, and this runs.
#
# The PyPI side must be configured first; see docs/releasing.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip build twine && python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Read package version
        id: version
        run: |
          version=$(python -c "import catagg; print(catagg.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"

      - name: Check tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/catagg/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
